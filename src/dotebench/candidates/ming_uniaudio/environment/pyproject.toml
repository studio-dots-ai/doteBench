[project]
name = "dotebench-ming-uniaudio"
version = "0.1.0"
description = "Ming-UniAudio-16B-A3B-Edit inference service environment"
requires-python = ">=3.10,<3.11"
dependencies = [
    "dotebench==1.0.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.52.4",
    "tokenizers>=0.21,<0.22",
    "accelerate==1.3.0",
    "diffusers==0.33.0",
    "peft==0.17.1",
    "soundfile==0.12.1",
    "x-transformers>=2.3,<3",
    "torchdiffeq>=0.2.5,<0.3",
    "torchtune>=0.6,<0.7",
    "torchao>=0.9,<0.10",
    "numpy>=1.26,<2",
    "pillow>=10,<12",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "setuptools>=70,<81",
    "tqdm>=4.66,<5",
    "loguru>=0.7,<0.8",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "pydantic>=2.7,<3",
    "pytest>=9,<10",
    "httpx>=0.28,<0.29",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
dotebench = { path = "../../../../..", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
