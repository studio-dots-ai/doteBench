[project]
name = "dotebench-fireredtts3-instruct"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dotebench==1.0.0",
  "flash-attn==2.8.3",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchcodec==0.7.0",
  "transformers==5.6.2",
  "einops==0.8.2",
  "python-dotenv>=1,<2",
  "regex>=2025.7",
  "wetext>=0.0.4,<0.1",
  "fasttext>=0.9.3,<0.10",
  "faster-whisper>=1.2,<2",
  "soundfile>=0.13,<0.14",
  "huggingface-hub>=0.36,<2",
  "numpy>=1.26,<3",
]

[tool.uv.sources]
dotebench = { path = "../../../../..", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.8.0", "setuptools", "packaging", "psutil", "ninja"]
