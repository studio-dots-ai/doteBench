defaults:
- base
- _self_
services:
  aligner:
    instance_key: auk-aligner
    config_key: auk-aligner
    host: ${runtime.host}
    port: 18001
    url: http://${.host}:${.port}
    python_bin: ${oc.env:DOTEBENCH_ALIGNER_PYTHON,${runtime.python}}
    gpu_ids: ${oc.env:DOTEBENCH_ALIGNER_GPU_IDS,0}
    startup_timeout_sec: 1800
    model_path: ${runtime.model_root}/Qwen3-ForcedAligner-0.6B
    command:
    - ${..python_bin}
    - -m
    - dotebench.candidates.auk_base.aligner
    - --model-path
    - ${..model_path}
    - --host
    - ${..host}
    - --port
    - ${..port}
