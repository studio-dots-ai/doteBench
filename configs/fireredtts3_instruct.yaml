defaults:
- base
- _self_
candidate:
  name: fireredtts3-instruct
  options:
    scratch_dir: ${runtime.output_root}/candidate-scratch
    require_runtime_identity: true
services:
  candidate:
    instance_key: fireredtts3-instruct
    config_key: fireredtts3-instruct
    url: http://${.host}:${.port}
    health_path: /health
    gpu_ids: ${oc.env:DOTEBENCH_GPU_IDS,0}
    startup_timeout_sec: 1800
    command:
    - ${..python_bin}
    - -m
    - dotebench.candidates.common.launch
    - --candidate
    - fireredtts3-instruct
    - --source-root
    - ${..source_root}
    - --runtime-root
    - ${..runtime_root}
    - --output-root
    - ${runtime.output_root}
    - --
    - --host
    - ${..host}
    - --port
    - ${..port}
    - --model-path
    - ${..model_path}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    host: ${runtime.host}
    port: ${oc.env:DOTEBENCH_CANDIDATE_PORT,18000}
    python_bin: ${oc.env:DOTEBENCH_CANDIDATE_PYTHON,${runtime.python}}
    model_path: ${oc.env:DOTEBENCH_MODEL_PATH}
    source_root: ${oc.env:DOTEBENCH_SOURCE_ROOT}
    runtime_root: ${oc.env:DOTEBENCH_RUNTIME_ROOT}
