defaults:
  - base
  - _self_
services:
  indextts2:
    instance_key: indextts2
    config_key: indextts2
    host: ${runtime.host}
    port: 18102
    url: http://${.host}:${.port}
    health_path: /health
    gpu_ids: ${oc.env:DOTEBENCH_INDEXTTS2_GPU_IDS,0}
    startup_timeout_sec: 1800
    python_bin: ${oc.env:DOTEBENCH_INDEXTTS2_PYTHON,${runtime.env_root}/dotebench-indextts2/bin/python}
    upstream: ${runtime.source_root}/third_party/index-tts
    model_path: ${runtime.model_root}/IndexTTS-2
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    command:
      - ${..python_bin}
      - -m
      - dotebench.materialization.backends.indextts2
      - --host
      - ${..host}
      - --port
      - ${..port}
      - --upstream
      - ${..upstream}
      - --model-path
      - ${..model_path}
      - --fp16
