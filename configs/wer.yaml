defaults:
  - base
  - _self_
services:
  wer:
    instance_key: wer
    config_key: wer
    python_bin: ${runtime.python}
    host: ${runtime.host}
    port: 8010
    url: http://${.host}:${.port}
    health_path: /health
    gpu_ids: ""
    startup_timeout_sec: 1800
    startup_sleep_sec: 0
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    command:
      - ${..python_bin}
      - -m
      - dotebench.services.backends.wer
      - --host
      - ${..host}
      - --port
      - ${..port}
