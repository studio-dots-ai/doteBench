defaults:
- base
- auk_aligner
- _self_
candidate:
  name: auk-base
  options:
    scratch_dir: ${runtime.output_root}/candidate-scratch
    require_runtime_identity: true
    context_mode: clean
    timeout: 1800
services:
  candidate:
    instance_key: auk-base
    config_key: auk-base
    url: http://${.host}:${.port}
    health_path: /health
    gpu_ids: ${oc.env:DOTEBENCH_GPU_IDS,0}
    startup_timeout_sec: 1800
    command:
    - ${..python_bin}
    - -m
    - dotebench.candidates.common.launch
    - --candidate
    - auk-base
    - --source-root
    - ${..source_root}
    - --runtime-root
    - ${..runtime_root}
    - --output-root
    - ${runtime.output_root}
    - --
    - --host
    - ${..host}
    - --port
    - ${..port}
    - --checkpoint-dir
    - ${..model_path}
    - --qwen-path
    - ${..tokenizer_path}
    - --weights-manifest
    - ${oc.env:DOTEBENCH_WEIGHTS_MANIFEST}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    host: ${runtime.host}
    port: ${oc.env:DOTEBENCH_CANDIDATE_PORT,18000}
    python_bin: ${oc.env:DOTEBENCH_CANDIDATE_PYTHON,${runtime.python}}
    model_path: ${oc.env:DOTEBENCH_MODEL_PATH}
    tokenizer_path: ${oc.env:DOTEBENCH_TOKENIZER_PATH}
    source_root: ${oc.env:DOTEBENCH_SOURCE_ROOT}
    runtime_root: ${oc.env:DOTEBENCH_RUNTIME_ROOT}
