defaults:
  - base
  - _self_
services:
  utmos:
    instance_key: utmos
    config_key: utmos
    python_bin: ${runtime.python}
    host: ${runtime.host}
    port: 8017
    url: http://${.host}:${.port}
    health_path: /health
    gpu_ids: "0"
    startup_timeout_sec: 1800
    startup_sleep_sec: 0
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    model_path: ${runtime.model_root}/UTMOS
    command:
      - ${..python_bin}
      - -m
      - dotebench.services.backends.utmos
      - --host
      - ${..host}
      - --port
      - ${..port}
      - --model-path
      - ${..model_path}
