defaults:
  - base
  - _self_
services:
  qwen3_aligner:
    instance_key: qwen3_aligner
    config_key: qwen3_aligner
    python_bin: ${runtime.python}
    host: ${runtime.host}
    port: 18009
    url: http://${.host}:${.port}
    health_path: /health
    gpu_ids: "0"
    startup_timeout_sec: 1800
    startup_sleep_sec: 0
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    model_path: ${runtime.model_root}/Qwen3-ForcedAligner-0.6B
    command:
      - ${..python_bin}
      - -m
      - dotebench.services.backends.qwen3_aligner
      - --host
      - ${..host}
      - --port
      - ${..port}
      - --model-path
      - ${..model_path}
