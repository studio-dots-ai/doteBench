[project]
name = "dotebench-env-qwen-asr"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "dotebench",
    "qwen-asr==0.0.6",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "numpy==1.26.4",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "fastapi>=0.127,<1",
    "uvicorn>=0.38,<1",
]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"

[tool.uv.sources]
dotebench = { path = "../..", editable = true }
