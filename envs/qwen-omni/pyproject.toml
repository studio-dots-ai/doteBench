[project]
name = "dotebench-env-qwen-omni"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dotebench",
    "vllm[audio]==0.19.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "transformers==5.5.0",
    "accelerate==1.13.0",
    "numpy==2.2.6",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "fastapi>=0.127,<1",
    "uvicorn>=0.38,<1",
]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"
override-dependencies = ["transformers==5.5.0"]

[tool.uv.sources]
dotebench = { path = "../..", editable = true }
