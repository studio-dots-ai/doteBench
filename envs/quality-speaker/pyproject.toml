[project]
name = "dotebench-env-quality-speaker"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "dotebench",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "fastapi>=0.127,<1",
    "uvicorn>=0.38,<1",
]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"

[tool.uv.sources]
dotebench = { path = "../..", editable = true }
