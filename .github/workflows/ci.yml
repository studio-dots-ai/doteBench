name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra metrics
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m dotebench.compilation check
      - run: PYTHONPATH=src uv run --frozen python scripts/build_text_provenance.py --check
      - if: matrix.python-version == '3.12'
        run: uv build --out-dir dist
